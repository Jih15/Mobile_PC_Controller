[package]
name = "host"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
serialport = "4.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
vigem-client = "0.1"
log = "0.4.35"
env_logger = "0.11.11"
anyhow = "1.0.104"
once_cell = "1.21.4"
tray-icon = "0.26.1"
winreg = "0.56"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",              # timeBeginPeriod / timeEndPeriod
] }