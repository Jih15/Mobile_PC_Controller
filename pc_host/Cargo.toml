[package]
name = "pc_host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pc_host"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vigem-client = "0.1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
once_cell = "1"
tray-icon = "0.14"
winreg = "0.52"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media",              # timeBeginPeriod / timeEndPeriod
] }